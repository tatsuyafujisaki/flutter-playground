on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # https://fvm.app/documentation/getting-started/installation
      - run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"
      # .fvmrc pins the "stable" channel, so the cache key uses the current
      # commit of the stable branch to pick up new stable releases.
      - id: flutter
        run: echo "stable-sha=$(git ls-remote https://github.com/flutter/flutter.git refs/heads/stable | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/fvm/versions
            ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ steps.flutter.outputs.stable-sha }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ runner.os }}-${{ steps.flutter.outputs.stable-sha }}-
      - run: fvm config --no-use-git-cache --no-update-check
      - run: fvm install --skip-pub-get
      - env:
          FIREBASE_OPTIONS_DEV_BASE64: ${{ secrets.FIREBASE_OPTIONS_DEV_BASE64 }}
          FIREBASE_OPTIONS_PROD_BASE64: ${{ secrets.FIREBASE_OPTIONS_PROD_BASE64 }}
        run: |
          echo "$FIREBASE_OPTIONS_DEV_BASE64" | base64 --decode > lib/firebase_options_dev.dart
          echo "$FIREBASE_OPTIONS_PROD_BASE64" | base64 --decode > lib/firebase_options_prod.dart
      - run: fvm flutter pub get
      - run: test ! -s lib/l10n/untranslated.txt
      - run: fvm dart run build_runner build
      - run: fvm dart format --output none --set-exit-if-changed .
      - run: fvm flutter analyze --fatal-infos
      - run: fvm flutter test
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: functions/package.json
      - run: npm install --no-package-lock
      - run: npx tsc --noEmit

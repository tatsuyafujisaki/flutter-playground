# Build performance settings. These differ from the Gradle defaults.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties
org.gradle.caching=true
org.gradle.jvmargs=-Xmx6g
org.gradle.parallel=true
# Set explicitly because the Flutter migrator adds these flags with a value of
# false when they are absent. True matches the AGP 9 defaults.
android.builtInKotlin=true
android.newDsl=true

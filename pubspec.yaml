name: flutter_playground
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.14.0
# Unconstrained versions are intentional in this playground repository.
dependencies:
  async: any
  cloud_functions: any
  collection: any
  dio: any
  firebase_analytics: any
  firebase_auth: any
  firebase_core: any
  firebase_crashlytics: any
  firebase_remote_config: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: any
  flutter_slidable: any
  freezed_annotation: any
  geolocator: any
  google_maps_flutter: any
  google_maps_flutter_ios_sdk10: any
  image_picker: any
  intl: any
  json_annotation: any
  livekit_client: any
  material_ui: any
  package_info_plus: any
  path: any
  path_provider: any
  permission_handler: any
  pub_semver: any
  riverpod_annotation: any
  url_launcher: any
  video_player: any
  webview_flutter: any
  xml: any
dev_dependencies:
  build_runner: any
  fake_async: any
  flutter_test:
    sdk: flutter
  freezed: any
  json_serializable: any
  riverpod_generator: any
  riverpod_lint: any
  very_good_analysis: any
flutter:
  default-flavor: dev
  generate: true # https://docs.flutter.dev/ui/internationalization#adding-your-own-localized-messages
  uses-material-design: true
